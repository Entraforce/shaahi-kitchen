<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#08080B" />
<title>Shaahi Biryani — Kitchen</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Tailwind CSS (utility framework) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class', corePlugins: { preflight: false } };</script>
<style>
  :root{
    --bg:#08080B; --bg-2:#0C0C11;
    --glass:rgba(20,22,30,.55); --glass-2:rgba(28,30,40,.6); --glass-strong:rgba(16,17,24,.7);
    --border:rgba(255,255,255,.09); --border-2:rgba(255,255,255,.16);
    --text:#F4F5F8; --text-2:#AEB0BC; --text-3:#747682;
    --gold:#E8C97A; --gold-d:#C9A84C; --maroon:#5C0A14;
    --new:#F5C451; --accepted:#5B9BF0; --preparing:#A78BFA; --ready:#34D399; --delivery:#FB923C; --danger:#F4707A;
    --display:'Cinzel',serif; --body:'Manrope',system-ui,-apple-system,sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; }
  html,body{ height:100%; }
  body{
    background:
      radial-gradient(900px 600px at 18% -10%, rgba(201,168,76,.07), transparent 60%),
      radial-gradient(900px 700px at 100% 110%, rgba(91,10,20,.16), transparent 60%),
      var(--bg);
    background-attachment:fixed; color:var(--text);
    font-family:var(--body); font-size:16px; -webkit-font-smoothing:antialiased;
  }
  button{ font-family:var(--body); cursor:pointer; border:none; }
  .hidden{ display:none !important; }

  /* ── Centered logo watermark — large, ~7%, never blocks clicks ── */
  #watermark{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:url('logo-watermark.png') no-repeat center center;
    background-size:min(58vmin, 540px) auto;
    opacity:.055;
  }
  #login-view,#board-view{ position:relative; z-index:1; }

  /* ── Header (glass) ── */
  header{
    position:sticky; top:0; z-index:30;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:13px 22px;
    background:var(--glass-strong); backdrop-filter:blur(22px) saturate(140%); -webkit-backdrop-filter:blur(22px) saturate(140%);
    border-bottom:1px solid var(--border);
  }
  .brand{ display:flex; align-items:center; gap:13px; }
  .logo-medallion{
    width:46px; height:46px; border-radius:14px; flex:0 0 auto; overflow:hidden;
    background:rgba(255,255,255,.05); border:1px solid var(--border-2);
    display:flex; align-items:center; justify-content:center;
  }
  .logo-medallion img{ width:100%; height:100%; object-fit:contain; }
  .logo-medallion.lg{ width:118px; height:118px; border-radius:30px; background:rgba(255,255,255,.04); }
  .brand h1{ font-family:var(--display); margin:0; font-size:18px; letter-spacing:.18em; color:var(--gold); text-transform:uppercase; font-weight:700; text-shadow:0 0 24px rgba(201,168,76,.25); }
  .brand .sub{ font-size:10px; font-weight:800; letter-spacing:.2em; color:var(--text-2); text-transform:uppercase; background:rgba(255,255,255,.06); padding:4px 11px; border-radius:999px; border:1px solid var(--border); }
  .head-right{ display:flex; align-items:center; gap:14px; }
  .clock{ font-variant-numeric:tabular-nums; color:var(--text); font-size:15px; font-weight:700; letter-spacing:.03em; }
  .pill-btn{ background:rgba(255,255,255,.05); color:var(--text-2); border:1px solid var(--border); padding:9px 16px; border-radius:11px; font-size:12px; font-weight:600; letter-spacing:.02em; backdrop-filter:blur(8px); transition:all .15s; }
  .pill-btn:hover{ background:rgba(255,255,255,.1); color:var(--text); border-color:var(--border-2); }
  .dot{ width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:7px; vertical-align:middle; }
  .dot.live{ background:var(--ready); box-shadow:0 0 0 3px rgba(52,211,153,.2), 0 0 12px var(--ready); animation:livePulse 2s ease-in-out infinite; }
  .dot.off{ background:var(--text-3); }
  @keyframes livePulse{ 0%,100%{ box-shadow:0 0 0 3px rgba(52,211,153,.2), 0 0 10px rgba(52,211,153,.5);} 50%{ box-shadow:0 0 0 4px rgba(52,211,153,.28), 0 0 18px rgba(52,211,153,.8);} }
  .conn{ font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--text-3); text-transform:uppercase; }

  /* ── Login (glass) ── */
  #login-view{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; gap:8px; }
  #login-view h1{ font-family:var(--display); color:var(--gold); letter-spacing:.16em; text-transform:uppercase; font-size:26px; font-weight:700; margin:0; text-align:center; text-shadow:0 0 30px rgba(201,168,76,.3); }
  #login-view .tag{ font-size:12px; font-weight:600; letter-spacing:.2em; color:var(--text-2); text-transform:uppercase; }
  .login-divider{ width:130px; height:1px; margin:18px 0 22px; background:linear-gradient(to right,transparent,var(--gold-d),transparent); }
  .login-card{ background:var(--glass); backdrop-filter:blur(22px) saturate(150%); -webkit-backdrop-filter:blur(22px) saturate(150%); border:1px solid var(--border-2); border-radius:22px; box-shadow:0 30px 70px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06); padding:30px; width:100%; max-width:380px; display:flex; flex-direction:column; gap:13px; }
  .login-card input{ background:rgba(0,0,0,.35); border:1px solid var(--border-2); color:var(--text); padding:15px 16px; border-radius:12px; font-size:16px; font-family:var(--body); font-weight:500; transition:all .15s; }
  .login-card input::placeholder{ color:var(--text-3); }
  .login-card input:focus{ outline:none; border-color:var(--gold-d); box-shadow:0 0 0 3px rgba(201,168,76,.18); }
  .btn-gold{ background:linear-gradient(135deg,#F0D88C,var(--gold-d)); color:#2A1A06; font-weight:800; padding:16px; border-radius:12px; letter-spacing:.04em; font-size:14px; box-shadow:0 10px 26px rgba(201,168,76,.32); transition:all .12s; }
  .btn-gold:hover{ filter:brightness(1.06); box-shadow:0 12px 32px rgba(201,168,76,.45); transform:translateY(-1px); }
  .btn-gold:active{ transform:translateY(0); }
  .btn-gold:disabled{ opacity:.5; cursor:default; box-shadow:none; }
  .err{ color:var(--danger); font-size:14px; min-height:18px; text-align:center; }

  /* ── Board ── */
  #board-view{ padding:0; }
  .toolbar{ display:flex; align-items:center; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
  .count-chip{ color:var(--text-2); font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; display:flex; align-items:center; gap:10px; }
  .count-chip b{ color:var(--gold); font-size:24px; font-weight:800; background:var(--glass); backdrop-filter:blur(10px); border:1px solid var(--border-2); border-radius:12px; padding:3px 15px; letter-spacing:0; }
  .toggle{ color:var(--text-3); font-size:12px; font-weight:600; display:flex; align-items:center; gap:8px; cursor:pointer; text-transform:uppercase; letter-spacing:.02em; }
  .toggle input{ width:16px; height:16px; accent-color:var(--gold-d); }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr)); gap:16px; align-items:start; }

  /* ── Card (glassmorphism) ── */
  .card{
    background:var(--glass); backdrop-filter:blur(18px) saturate(150%); -webkit-backdrop-filter:blur(18px) saturate(150%);
    border:1px solid var(--border); border-left:4px solid var(--border-2);
    border-radius:18px; overflow:hidden; display:flex; flex-direction:column;
    box-shadow:0 16px 44px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{ transform:translateY(-3px); box-shadow:0 22px 56px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08); }
  .card.s-pending{ border-left-color:var(--new); box-shadow:0 0 0 1px rgba(245,196,81,.35), 0 16px 44px rgba(245,196,81,.14); }
  .card.s-accepted{ border-left-color:var(--accepted); }
  .card.s-preparing{ border-left-color:var(--preparing); }
  .card.s-ready{ border-left-color:var(--ready); }
  .card.s-out_for_delivery{ border-left-color:var(--delivery); }
  .card.s-delivered,.card.s-cancelled{ border-left-color:var(--text-3); opacity:.55; }
  .card.flash{ animation:flashPulse 1.5s ease-in-out infinite; }
  @keyframes flashPulse{ 0%,100%{ box-shadow:0 0 0 1px rgba(245,196,81,.32), 0 16px 44px rgba(245,196,81,.12);} 50%{ box-shadow:0 0 0 1px rgba(245,196,81,.8), 0 18px 54px rgba(245,196,81,.4);} }

  .card-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:13px 16px 0; min-height:14px; }
  .ordno{ display:flex; align-items:center; gap:6px; }
  .ftype{ font-size:10px; letter-spacing:.1em; text-transform:uppercase; padding:5px 11px; border-radius:8px; font-weight:700; }
  .ftype.pickup{ background:rgba(91,155,240,.18); color:#9cc4f7; }
  .ftype.delivery{ background:rgba(251,146,60,.18); color:#fbbf24; }
  .ftype.dine_in{ background:rgba(201,168,76,.18); color:var(--gold); }

  .meta{ display:flex; align-items:center; justify-content:space-between; padding:11px 16px; }
  .status-badge{ font-size:11px; letter-spacing:.05em; text-transform:uppercase; font-weight:800; padding:5px 13px; border-radius:999px; }
  .sb-pending{ background:var(--new); color:#3a2c00; }
  .sb-accepted{ background:var(--accepted); color:#06203f; }
  .sb-preparing{ background:var(--preparing); color:#231147; }
  .sb-ready{ background:var(--ready); color:#053826; }
  .sb-out_for_delivery{ background:var(--delivery); color:#3a1e00; }
  .sb-delivered,.sb-cancelled{ background:rgba(255,255,255,.08); color:var(--text-2); }
  .elapsed{ font-size:14px; font-weight:700; color:var(--text-2); font-variant-numeric:tabular-nums; }
  /* When the order was placed. Deliberately quieter than .elapsed — the
     countdown is what drives the line; this is for reconciling a ticket
     against the POS, and for telling apart orders either side of midnight. */
  .placed{ font-size:12px; font-weight:600; color:var(--text-2); opacity:.72; font-variant-numeric:tabular-nums; }
  .elapsed.warn{ color:var(--new); }
  .elapsed.late{ color:var(--danger); }

  .cust{ padding:0 16px 13px; font-size:15px; color:var(--text-2); border-bottom:1px solid var(--border); }
  .cust .name{ color:var(--text); font-weight:700; font-size:17px; }
  .cust a{ color:var(--gold); text-decoration:none; }
  .cust .addr{ display:block; margin-top:3px; color:var(--text-3); font-size:14px; }

  .items{ padding:14px 16px; display:flex; flex-direction:column; gap:12px; }
  .line{ display:flex; gap:12px; align-items:baseline; }
  .qty{ color:var(--gold); font-weight:800; min-width:30px; font-size:17px; font-variant-numeric:tabular-nums; }
  .line-body{ flex:1; }
  .line-name{ color:var(--text); font-size:18px; font-weight:700; line-height:1.25; }
  .line-variant{ color:var(--text-3); font-size:14px; font-weight:500; margin-top:1px; }
  .line-note{ color:var(--new); font-size:14px; font-weight:600; margin-top:4px; background:rgba(245,196,81,.12); padding:4px 10px; border-radius:8px; display:inline-block; }
  .line-note::before{ content:"✏ "; }

  .totals{ padding:12px 16px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:baseline; }
  .totals .lbl{ color:var(--text-3); text-transform:uppercase; letter-spacing:.08em; font-size:11px; font-weight:600; }
  .totals .amt{ color:var(--gold); font-size:21px; font-weight:800; font-variant-numeric:tabular-nums; }
  .redeemed{ font-size:13px; color:var(--text-3); text-transform:none; letter-spacing:0; }

  .actions{ padding:12px 13px; display:flex; gap:9px; border-top:1px solid var(--border); }
  .act{ flex:1; padding:15px 8px; border-radius:12px; font-size:13px; letter-spacing:.02em; text-transform:uppercase; font-weight:800; color:#fff; transition:filter .15s, transform .06s; }
  .act:active{ transform:translateY(1px); }
  .act.primary{ background:linear-gradient(135deg,#41D98E,#16A765); box-shadow:0 8px 22px rgba(22,167,101,.34); }
  .act.neutral{ background:linear-gradient(135deg,#6AA9F2,#3B7FD6); box-shadow:0 8px 22px rgba(59,127,214,.34); }
  .act.primary:hover,.act.neutral:hover{ filter:brightness(1.08); }
  .act.danger{ background:rgba(244,112,122,.08); color:var(--danger); border:1px solid rgba(244,112,122,.45); flex:0 0 auto; padding:15px 16px; box-shadow:none; }
  .act.danger:hover{ background:rgba(244,112,122,.16); }
  .act:disabled{ opacity:.5; cursor:default; filter:none; }

  .empty{ text-align:center; padding:100px 20px; color:var(--text-3); }
  .empty .big{ font-family:var(--display); font-size:20px; letter-spacing:.1em; color:var(--text-2); text-transform:uppercase; margin-bottom:10px; }
  .empty .big + div{ font-size:15px; }

  .sound-prompt{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--glass-2); backdrop-filter:blur(16px); color:var(--gold); border:1px solid var(--border-2); padding:13px 22px; border-radius:999px; font-size:13px; font-weight:600; z-index:50; cursor:pointer; box-shadow:0 14px 34px rgba(0,0,0,.55); }
  .sound-prompt:hover{ background:var(--glass-strong); }

  /* ── Refunds ── */
  #refunds-view{ padding:0; }
  .refund-toolbar{ display:flex; gap:10px; align-items:center; margin:16px 0; flex-wrap:wrap; }
  .refund-search{ flex:1; min-width:220px; background:rgba(0,0,0,.3); border:1px solid var(--border-2); color:var(--text); padding:11px 14px; border-radius:11px; font-size:14px; font-family:var(--body); }
  .refund-search::placeholder{ color:var(--text-3); }
  .refund-search:focus{ outline:none; border-color:var(--gold-d); }
  .web-badge{ background:var(--gold); color:var(--maroon); font-size:9px; padding:2px 7px; border-radius:5px; letter-spacing:.14em; font-weight:800; margin-right:8px; }
  .refund-badge{ font-size:11px; letter-spacing:.05em; text-transform:uppercase; font-weight:800; padding:5px 13px; border-radius:999px; }
  .rb-partial{ background:var(--delivery); color:#3a1e00; }
  .rb-full{ background:var(--ready); color:#053826; }
  .refund-items{ padding:12px 16px; display:flex; flex-direction:column; gap:10px; border-top:1px solid var(--border); }
  .ritem{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .ritem-name{ color:var(--text); font-size:15px; font-weight:700; }
  .ritem-variant{ color:var(--text-3); font-weight:500; }
  .ritem-sub{ color:var(--text-3); font-size:13px; margin-top:2px; }
  .ritem-qty{ width:56px; background:rgba(0,0,0,.3); border:1px solid var(--border-2); color:var(--text); padding:8px; border-radius:8px; font-size:15px; text-align:center; font-family:var(--body); }
  .ritem-qty:disabled{ opacity:.4; }
  .refund-summary{ padding:10px 16px; display:flex; justify-content:space-between; border-top:1px solid var(--border); color:var(--text-2); font-size:13px; }
  .refund-summary .amt{ color:var(--gold); font-weight:800; }
  .refund-panel{ padding:12px 16px 16px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:10px; }
  .refund-live-total{ color:var(--text-2); font-size:14px; }
  .refund-live-total b{ color:var(--gold); font-size:17px; }
  .refund-reason{ background:rgba(0,0,0,.3); border:1px solid var(--border-2); color:var(--text); padding:11px 12px; border-radius:11px; font-size:14px; font-family:var(--body); }

  /* ── Mobile / small screens ── */
  @media (max-width:640px){
    header{ padding:10px 14px; }
    .brand{ gap:10px; }
    .brand h1{ display:none; }
    .logo-medallion{ width:40px; height:40px; border-radius:12px; }
    .brand .sub{ font-size:9px; padding:3px 8px; letter-spacing:.14em; }
    .head-right{ gap:9px; }
    .clock{ font-size:13px; }
    #conn-text{ display:none; }
    .pill-btn{ padding:8px 12px; font-size:11px; }
    .count-chip{ font-size:11px; }
    .count-chip b{ font-size:20px; padding:2px 11px; }
    .toggle{ font-size:11px; }
    .grid{ gap:13px; }
    #watermark{ background-size:min(74vmin, 380px) auto; opacity:.05; }
    .line-name{ font-size:16px; }
    .act{ padding:14px 6px; font-size:12px; }
    .sound-prompt{ font-size:12px; padding:11px 18px; bottom:14px; }
  }
  @media (max-width:380px){
    .brand .sub{ display:none; }
  }
</style>


</head>
<body>

  <div id="watermark"></div>

  <!-- LOGIN -->
  <div id="login-view">
    <div class="logo-medallion lg" style="margin-bottom:18px;"><img src="logo.png" alt="Shaahi Biryani" /></div>
    <h1>Shaahi Biryani</h1>
    <div class="tag">Kitchen Display</div>
    <div class="login-divider"></div>
    <div class="login-card">
      <input id="email" type="email" placeholder="Staff email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" />
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" />
      <button id="login-btn" class="btn-gold">Sign in</button>
      <div id="login-err" class="err"></div>
    </div>
  </div>

  <!-- BOARD -->
  <div id="board-view" class="hidden">
    <header>
      <div class="brand">
        <div class="logo-medallion"><img src="logo.png" alt="Shaahi Biryani" /></div>
        <h1>Shaahi Biryani</h1>
        <span class="sub">Kitchen</span>
      </div>
      <div class="head-right">
        <span class="conn"><span id="conn-dot" class="dot off"></span><span id="conn-text">connecting…</span></span>
        <span id="clock" class="clock"></span>
        <button id="refunds-nav-btn" class="pill-btn">Refunds</button>
        <button id="signout-btn" class="pill-btn">Sign out</button>
      </div>
    </header>

    <div style="padding:0 18px;">
      <div class="toolbar" style="margin-top:16px;">
        <span class="count-chip"><b id="active-count">0</b> active orders</span>
        <label class="toggle"><input type="checkbox" id="show-done" /> Show completed today</label>
        <button id="refresh-btn" class="pill-btn">Refresh</button>
      </div>
    </div>

    <div id="board-view-inner" style="padding:0 18px 40px;">
      <div id="grid" class="grid"></div>
      <div id="empty" class="empty hidden">
        <div class="big">No active orders</div>
        <div>New orders will appear here automatically.</div>
      </div>
    </div>
  </div>

  <!-- REFUNDS -->
  <div id="refunds-view" class="hidden">
    <header>
      <div class="brand">
        <div class="logo-medallion"><img src="logo.png" alt="Shaahi Biryani" /></div>
        <h1>Shaahi Biryani</h1>
        <span class="sub">Refunds</span>
      </div>
      <div class="head-right">
        <button id="board-nav-btn" class="pill-btn">Board</button>
        <button id="refunds-signout-btn" class="pill-btn">Sign out</button>
      </div>
    </header>

    <div style="padding:0 18px;">
      <div class="refund-toolbar">
        <input id="refund-search" class="refund-search" type="text" placeholder="Search by customer name or phone…" autocapitalize="none" autocorrect="off" spellcheck="false" />
        <button id="refund-refresh-btn" class="pill-btn">Refresh</button>
      </div>
    </div>

    <div style="padding:0 18px 40px;">
      <div id="refund-order-list" class="grid"></div>
    </div>
  </div>

  <div id="sound-prompt" class="sound-prompt hidden">🔔 Tap to enable new-order sound</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// ── Config (anon key is public by design — safe to embed) ──
const SUPABASE_URL = 'https://wtdthjhqgsbnyjucdqxl.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0ZHRoamhxZ3NibnlqdWNkcXhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NjcxMzcsImV4cCI6MjA5MjQ0MzEzN30.1WYVcbrulkg0l7QB-scj4KcJCnMwFKSLHXucEdEZV3Q';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
});

const POLL_MS = 10000;
const ACTIVE = ['pending','accepted','preparing','ready','out_for_delivery'];

// Status → which transitions a button offers
function nextActions(status, fulfillment) {
  switch (status) {
    case 'pending':    return [{ label: 'Accept', to: 'accepted', cls: 'primary' }];
    case 'accepted':   return [{ label: 'Start preparing', to: 'preparing', cls: 'primary' }];
    case 'preparing':  return [{ label: 'Mark ready', to: 'ready', cls: 'primary' }];
    case 'ready':
      return fulfillment === 'delivery'
        ? [{ label: 'Out for delivery', to: 'out_for_delivery', cls: 'neutral' }]
        : [{ label: 'Complete', to: 'delivered', cls: 'primary' }];
    case 'out_for_delivery': return [{ label: 'Delivered', to: 'delivered', cls: 'primary' }];
    default: return [];
  }
}

const $ = (id) => document.getElementById(id);
const fmtMoney = (n) => '$' + Number(n || 0).toFixed(2);
const ordNo = (id) => id.slice(-6).toUpperCase();

// ── State ──
let pollTimer = null;
let ordersChannel = null;
let knownPendingIds = new Set();
let firstLoad = true;
let soundReady = false;
let audioCtx = null;

// ── Auth flow ──
async function init() {
  const { data } = await supabase.auth.getSession();
  if (data.session) await enterBoard();
  else showLogin();
}

function showLogin() {
  $('login-view').classList.remove('hidden');
  $('board-view').classList.add('hidden');
  $('refunds-view').classList.add('hidden');
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  unsubscribeRealtime();
}

function showBoard() {
  $('board-view').classList.remove('hidden');
  $('refunds-view').classList.add('hidden');
}
function showRefunds() {
  $('board-view').classList.add('hidden');
  $('refunds-view').classList.remove('hidden');
  loadRefundOrders();
}

$('login-btn').addEventListener('click', doLogin);
$('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const btn = $('login-btn');
  const email = $('email').value.trim();
  const password = $('password').value;
  $('login-err').textContent = '';
  if (!email || !password) { $('login-err').textContent = 'Enter email and password.'; return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'Sign in';
  if (error) { $('login-err').textContent = error.message; return; }
  await enterBoard();
}

$('signout-btn').addEventListener('click', async () => {
  await supabase.auth.signOut();
  knownPendingIds = new Set(); firstLoad = true;
  showLogin();
});

async function enterBoard() {
  // Gate: must be staff.
  const { data: isStaff, error } = await supabase.rpc('current_user_is_staff');
  if (error || !isStaff) {
    await supabase.auth.signOut();
    $('login-view').classList.remove('hidden');
    $('board-view').classList.add('hidden');
    $('login-err').textContent = error
      ? 'Could not verify access. Try again.'
      : 'This account is not authorized for the kitchen view.';
    return;
  }
  $('login-view').classList.add('hidden');
  $('board-view').classList.remove('hidden');
  if (!soundReady) $('sound-prompt').classList.remove('hidden');
  firstLoad = true;
  await loadOrders();
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(loadOrders, POLL_MS);
  subscribeRealtime();
}

// ── Realtime live updates (WebSockets via Supabase Realtime) ──
function subscribeRealtime() {
  unsubscribeRealtime();
  ordersChannel = supabase
    .channel('kitchen-orders')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => { loadOrders(); })
    .subscribe();
}
function unsubscribeRealtime() {
  if (ordersChannel) { supabase.removeChannel(ordersChannel); ordersChannel = null; }
}

// ── Data ──
async function loadOrders() {
  const showDone = $('show-done').checked;
  const statuses = showDone ? [...ACTIVE, 'delivered', 'cancelled'] : ACTIVE;

  let query = supabase
    .from('orders')
    .select('id, status, fulfillment, subtotal, tax, delivery_fee, tip, total, points_redeemed, delivery_address, table_number, created_at, user_id, guest_name, guest_phone, source, payment_status, order_items(item_name, variant_name, quantity, unit_price, special_instructions)')
    .in('status', statuses)
    // Show all app orders, but only PAID website (guest) orders — so abandoned
    // guest checkouts never show up. App orders have a user_id; guest orders don't.
    .or('user_id.not.is.null,payment_status.eq.paid')
    .eq('is_test', false)   // never show self-test rows to the kitchen
    .order('created_at', { ascending: true });

  // When showing completed, keep the list manageable.
  if (showDone) query = query.order('created_at', { ascending: false }).limit(60);

  const { data: orders, error } = await query;
  if (error) { setConn(false, 'connection lost'); return; }
  setConn(true, 'live');

  // Fetch customer profiles in one go (no FK dependency assumed).
  const userIds = [...new Set(orders.map((o) => o.user_id).filter(Boolean))];
  let profiles = {};
  if (userIds.length) {
    const { data: profRows } = await supabase
      .from('profiles').select('id, full_name, phone, email').in('id', userIds);
    (profRows || []).forEach((p) => { profiles[p.id] = p; });
  }

  // New pending-order chime.
  const pendingNow = orders.filter((o) => o.status === 'pending').map((o) => o.id);
  if (!firstLoad) {
    const fresh = pendingNow.filter((id) => !knownPendingIds.has(id));
    if (fresh.length) chime();
  }
  knownPendingIds = new Set(pendingNow);
  firstLoad = false;

  render(orders, profiles);
}

function render(orders, profiles) {
  const grid = $('grid');
  const showDone = $('show-done').checked;
  const visible = orders; // already filtered by query
  $('active-count').textContent = orders.filter((o) => ACTIVE.includes(o.status)).length;

  if (!visible.length) {
    grid.innerHTML = '';
    $('empty').classList.remove('hidden');
    return;
  }
  $('empty').classList.add('hidden');

  grid.innerHTML = visible.map((o) => card(o, profiles[o.user_id])).join('');

  // Wire action buttons.
  grid.querySelectorAll('button[data-order]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-order');
      const to = btn.getAttribute('data-to');
      if (to === 'cancelled' && !confirm('Cancel this order? This also reverses any loyalty points.')) return;
      updateStatus(id, to, btn);
    });
  });
}

function card(o, prof) {
  const items = o.order_items || [];
  const isDone = o.status === 'delivered' || o.status === 'cancelled';
  const acts = nextActions(o.status, o.fulfillment);
  const addr = o.delivery_address;
  const flash = o.status === 'pending' ? 'flash' : '';

  const itemsHtml = items.map((it) => `
    <div class="line">
      <div class="qty">${it.quantity}×</div>
      <div class="line-body">
        <div class="line-name">${esc(it.item_name)}</div>
        ${it.variant_name ? `<div class="line-variant">${esc(it.variant_name)}</div>` : ''}
        ${it.special_instructions ? `<div class="line-note">${esc(it.special_instructions)}</div>` : ''}
      </div>
    </div>`).join('');

  // Website orders are guests (no profile) — fall back to the name/phone
  // captured at web checkout, which ride on the order row itself.
  const custName = prof?.full_name || o.guest_name || 'Guest';
  const custPhone = prof?.phone || o.guest_phone || '';
  const custHtml = `
    <div class="cust">
      <span class="name">${esc(custName)}</span>
      ${custPhone ? ` · <a href="tel:${esc(custPhone)}">${esc(custPhone)}</a>` : ''}
      ${o.fulfillment === 'dine_in' && o.table_number
        ? `<div class="addr"><strong>Table ${esc(String(o.table_number))}</strong></div>` : ''}
      ${o.fulfillment === 'delivery' && addr
        ? `<span class="addr">${esc(addr.street || '')}${addr.apt ? ', ' + esc(addr.apt) : ''}, ${esc(addr.city || '')} ${esc(addr.zip || '')}</span>`
        : ''}
    </div>`;

  const actionsHtml = isDone ? '' : `
    <div class="actions">
      ${acts.map((a) => `<button class="act ${a.cls}" data-order="${o.id}" data-to="${a.to}">${a.label}</button>`).join('')}
      <button class="act danger" data-order="${o.id}" data-to="cancelled">Cancel</button>
    </div>`;

  const statusLabel = o.status.replace(/_/g, ' ');

  return `
    <div class="card s-${o.status} ${flash}" id="card-${o.id}">
      <div class="card-head">
        <div class="ordno">${o.source === 'web' ? '<span style="background:var(--gold);color:var(--maroon-d);font-size:9px;padding:2px 7px;border-radius:5px;letter-spacing:.14em;vertical-align:middle;">WEB</span>' : ''}</div>
        <div class="ftype ${o.fulfillment}">${esc((o.fulfillment || '').replace('_',' '))}</div>
      </div>
      <div class="meta">
        <span class="status-badge sb-${o.status}">${esc(statusLabel)}</span>
        <span class="elapsed" data-created="${o.created_at}"></span>
        <span class="placed">${fmtPlaced(o.created_at)}</span>
      </div>
      ${custHtml}
      <div class="items">${itemsHtml || '<div class="line-variant">No items</div>'}</div>
      ${actionsHtml}
    </div>`;
}

async function updateStatus(id, to, btn) {
  // Disable the whole card's buttons during the call.
  const cardEl = $('card-' + id);
  if (cardEl) cardEl.querySelectorAll('button').forEach((b) => (b.disabled = true));
  const { error } = await supabase.rpc('set_order_status', { p_order_id: id, p_status: to });
  if (error) {
    alert('Could not update order: ' + error.message);
    if (cardEl) cardEl.querySelectorAll('button').forEach((b) => (b.disabled = false));
    return;
  }
  notifyCustomer(id, to);
  await loadOrders();
}

// Push the status update to the customer's phone (best-effort —
// never blocks or breaks the kitchen flow).
async function notifyCustomer(orderId, status) {
  try {
    const { data } = await supabase.auth.getSession();
    const token = data?.session?.access_token;
    if (!token) return;
    fetch(SUPABASE_URL + '/functions/v1/notify-order-status', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: 'Bearer ' + token,
        apikey: SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({ order_id: orderId, status }),
    }).catch(() => {});
  } catch {
    /* best-effort */
  }
}

// ── Refunds ──
// Mirrors the server-side proportional-tax formula in begin_refund() purely
// for the live preview — the Edge Function recomputes and enforces the real
// number, so a bug here can't under/over-refund.
function proportionalTaxCents(order, newCumulativeSubtotalCents) {
  const originalSubtotalCents = Math.round(Number(order.subtotal) * 100);
  const originalTaxCents = Math.round(Number(order.tax) * 100);
  if (originalSubtotalCents <= 0) return 0;
  if (newCumulativeSubtotalCents >= originalSubtotalCents) return originalTaxCents;
  return Math.round((originalTaxCents * newCumulativeSubtotalCents) / originalSubtotalCents);
}

async function loadRefundOrders() {
  const term = $('refund-search').value.trim();
  let query = supabase
    .from('orders')
    .select('id, source, guest_name, guest_phone, subtotal, tax, total, payment_status, subtotal_refunded_cents, tax_refunded_cents, refund_status, stripe_payment_intent, created_at, order_items(id, item_name, variant_name, quantity, unit_price, refunded_quantity)')
    .eq('payment_status', 'paid')
    .eq('is_test', false)
    .order('created_at', { ascending: false })
    .limit(term ? 200 : 20);
  if (term) {
    query = query.or(`guest_name.ilike.%${term}%,guest_phone.ilike.%${term}%`);
  }

  const listEl = $('refund-order-list');
  const { data: orders, error } = await query;
  if (error) {
    listEl.innerHTML = `<div class="empty"><div class="big">Couldn't load orders</div><div>${esc(error.message)}</div></div>`;
    return;
  }
  if (!orders.length) {
    listEl.innerHTML = `<div class="empty"><div class="big">No paid orders found</div><div>Try a different search.</div></div>`;
    return;
  }

  listEl.innerHTML = orders.map(refundOrderCard).join('');
  orders.forEach((o) => {
    const el = document.getElementById('rcard-' + o.id);
    if (!el) return;
    el.querySelectorAll('.ritem-qty').forEach((input) => {
      input.addEventListener('input', () => updateRefundLiveTotal(el, o));
    });
    const btn = el.querySelector('.refund-confirm-btn');
    if (btn) btn.addEventListener('click', () => submitRefund(o.id, el, o));
  });
}

function refundOrderCard(o) {
  const items = o.order_items || [];
  const custName = o.guest_name || 'Guest';
  const custPhone = o.guest_phone || '';
  const rStatus = o.refund_status || 'none';
  const rLabel = rStatus === 'full' ? 'Refunded' : rStatus === 'partial' ? 'Partially refunded' : '';

  const itemRows = items.map((it) => {
    const remaining = it.quantity - (it.refunded_quantity || 0);
    return `
      <div class="ritem" data-item="${it.id}" data-unit-cents="${Math.round(Number(it.unit_price) * 100)}" data-remaining="${remaining}">
        <div class="ritem-info">
          <div class="ritem-name">${esc(it.item_name)}${it.variant_name ? ` <span class="ritem-variant">· ${esc(it.variant_name)}</span>` : ''}</div>
          <div class="ritem-sub">${fmtMoney(it.unit_price)} each · ${it.quantity} ordered${it.refunded_quantity ? `, ${it.refunded_quantity} already refunded` : ''}</div>
        </div>
        <input type="number" class="ritem-qty" min="0" max="${remaining}" value="0" ${remaining <= 0 ? 'disabled' : ''} />
      </div>`;
  }).join('');

  return `
    <div class="card refund-card" id="rcard-${o.id}">
      <div class="card-head">
        <div class="ordno">
          ${o.source === 'web' ? '<span class="web-badge">WEB</span>' : ''}
          <span style="color:var(--text-2);font-weight:700;">#${ordNo(o.id)}</span>
        </div>
        ${rLabel ? `<span class="refund-badge rb-${rStatus}">${rLabel}</span>` : ''}
      </div>
      <div class="cust">
        <span class="name">${esc(custName)}</span>
        ${custPhone ? ` · <a href="tel:${esc(custPhone)}">${esc(custPhone)}</a>` : ''}
      </div>
      <div class="refund-items">${itemRows || '<div class="line-variant">No items</div>'}</div>
      <div class="refund-summary">
        <span class="lbl">Order total</span>
        <span class="amt">${fmtMoney(o.total)}</span>
      </div>
      <div class="refund-panel">
        <div class="refund-live-total">Refund total: <b>$0.00</b></div>
        <select class="refund-reason">
          <option value="requested_by_customer">Requested by customer</option>
          <option value="duplicate">Duplicate charge</option>
          <option value="fraudulent">Fraudulent</option>
          <option value="other">Other</option>
        </select>
        <button class="act primary refund-confirm-btn" data-order="${o.id}" disabled>Refund selected items</button>
        <div class="refund-err err"></div>
      </div>
    </div>`;
}

function updateRefundLiveTotal(orderEl, order) {
  const rows = orderEl.querySelectorAll('.ritem');
  let subtotalCents = 0;
  let any = false;
  rows.forEach((row) => {
    const input = row.querySelector('.ritem-qty');
    const max = Number(row.dataset.remaining) || 0;
    let qty = Math.floor(Number(input.value)) || 0;
    if (qty < 0) qty = 0;
    if (qty > max) qty = max;
    input.value = qty;
    if (qty > 0) { any = true; subtotalCents += qty * Number(row.dataset.unitCents); }
  });
  const priorSubtotal = order.subtotal_refunded_cents || 0;
  const priorTax = order.tax_refunded_cents || 0;
  const newCumulative = priorSubtotal + subtotalCents;
  const idealTax = proportionalTaxCents(order, newCumulative);
  const taxDelta = idealTax - priorTax;
  const totalCents = subtotalCents + taxDelta;
  orderEl.querySelector('.refund-live-total b').textContent = fmtMoney(totalCents / 100);
  orderEl.querySelector('.refund-confirm-btn').disabled = !any;
  return { any };
}

async function submitRefund(orderId, orderEl, order) {
  const lines = [];
  orderEl.querySelectorAll('.ritem').forEach((row) => {
    const qty = Math.floor(Number(row.querySelector('.ritem-qty').value)) || 0;
    if (qty > 0) lines.push({ orderItemId: row.getAttribute('data-item'), quantity: qty });
  });
  if (!lines.length) return;

  const reason = orderEl.querySelector('.refund-reason').value;
  const errEl = orderEl.querySelector('.refund-err');
  const btn = orderEl.querySelector('.refund-confirm-btn');
  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Refunding…';
  orderEl.querySelectorAll('.ritem-qty').forEach((el) => (el.disabled = true));
  orderEl.querySelector('.refund-reason').disabled = true;

  try {
    const { data } = await supabase.auth.getSession();
    const token = data?.session?.access_token;
    if (!token) throw new Error('Session expired — please sign in again.');
    const clientRequestId = crypto.randomUUID();
    const resp = await fetch(SUPABASE_URL + '/functions/v1/refund-order-items', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: 'Bearer ' + token,
        apikey: SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({ orderId, lines, reason, clientRequestId }),
    });
    const json = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(json.error || 'Refund failed.');
    await loadRefundOrders();
  } catch (err) {
    errEl.textContent = err.message || 'Refund failed. Please try again.';
    btn.disabled = false;
    btn.textContent = 'Refund selected items';
    orderEl.querySelector('.refund-reason').disabled = false;
    orderEl.querySelectorAll('.ritem').forEach((row) => {
      const remaining = Number(row.getAttribute('data-remaining')) || 0;
      row.querySelector('.ritem-qty').disabled = remaining <= 0;
    });
  }
}

// ── Placed-at stamp ──
// Rendered once per card, not ticked: this is a fixed fact about the order.
// Date is always shown, not just for older orders — a screen left open across
// midnight would otherwise show "11:58 PM" and "12:04 AM" with no way to tell
// they are different days.
function fmtPlaced(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleString([], {
    month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit',
  });
}

// ── Elapsed-time ticker ──
function tickElapsed() {
  document.querySelectorAll('.elapsed[data-created]').forEach((el) => {
    const created = new Date(el.getAttribute('data-created')).getTime();
    const mins = Math.floor((Date.now() - created) / 60000);
    el.textContent = mins < 1 ? 'just now' : mins + ' min';
    el.classList.toggle('warn', mins >= 15 && mins < 30);
    el.classList.toggle('late', mins >= 30);
  });
}

// ── Clock ──
function tickClock() {
  const d = new Date();
  $('clock').textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function setConn(ok, text) {
  $('conn-dot').className = 'dot ' + (ok ? 'live' : 'off');
  $('conn-text').textContent = text;
}

// ── Sound ──
$('sound-prompt').addEventListener('click', () => {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  soundReady = true;
  $('sound-prompt').classList.add('hidden');
  chime();
});

function chime() {
  if (!soundReady || !audioCtx) return;
  const now = audioCtx.currentTime;
  [880, 1175, 1568].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    osc.connect(gain); gain.connect(audioCtx.destination);
    const t = now + i * 0.16;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.25, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    osc.start(t); osc.stop(t + 0.42);
  });
}

// ── Listeners ──
$('show-done').addEventListener('change', loadOrders);
$('refresh-btn').addEventListener('click', loadOrders);
$('refunds-nav-btn').addEventListener('click', showRefunds);
$('board-nav-btn').addEventListener('click', showBoard);
$('refunds-signout-btn').addEventListener('click', async () => {
  await supabase.auth.signOut();
  knownPendingIds = new Set(); firstLoad = true;
  showLogin();
});
$('refund-refresh-btn').addEventListener('click', loadRefundOrders);
let refundSearchTimer = null;
$('refund-search').addEventListener('input', () => {
  clearTimeout(refundSearchTimer);
  refundSearchTimer = setTimeout(loadRefundOrders, 350);
});
supabase.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_OUT') showLogin();
});

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

setInterval(tickElapsed, 1000);
setInterval(tickClock, 1000);
tickClock();
init();
</script>
