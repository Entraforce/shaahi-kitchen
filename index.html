<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A0A0C" />
<title>Shaahi Biryani — Kitchen</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0C; --bg-2:#0E0E13;
    --surface:#15161D; --surface-2:#1C1D27; --elevate:#232431;
    --border:rgba(255,255,255,.07); --border-2:rgba(255,255,255,.13);
    --text:#F3F4F7; --text-2:#A8AAB5; --text-3:#71737F;
    --gold:#E8C97A; --gold-d:#C9A84C; --maroon:#5C0A14; --maroon-d:#3A0509;
    --new:#F5C451; --accepted:#5B9BF0; --preparing:#A78BFA; --ready:#34D399; --delivery:#FB923C; --danger:#F4707A;
    --display:'Cinzel',serif; --body:'Manrope',system-ui,-apple-system,sans-serif;
    --radius:16px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; }
  html,body{ height:100%; }
  #watermark{ display:none; }
  #login-view,#board-view{ position:relative; z-index:1; }
  body{
    background:radial-gradient(1100px 620px at 50% -240px, rgba(201,168,76,.07), transparent 70%), var(--bg);
    background-attachment:fixed; color:var(--text);
    font-family:var(--body); font-size:16px; -webkit-font-smoothing:antialiased;
  }
  button{ font-family:var(--body); cursor:pointer; border:none; }
  .hidden{ display:none !important; }

  /* ── Header ── */
  header{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:13px 22px;
    background:rgba(11,11,15,.82); backdrop-filter:blur(20px) saturate(140%);
    border-bottom:1px solid var(--border);
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .logo-medallion{
    width:60px; height:60px; border-radius:16px; flex:0 0 auto; overflow:hidden;
    background:#FCFBF7; border:1px solid var(--border-2); padding:3px;
    display:flex; align-items:center; justify-content:center;
  }
  .logo-medallion img{ width:100%; height:100%; object-fit:contain; }
  .logo-medallion.lg{ width:92px; height:92px; border-radius:26px; }
  .brand h1{ font-family:var(--display); margin:0; font-size:18px; letter-spacing:.16em; color:var(--text); text-transform:uppercase; font-weight:700; }
  .brand .sub{ font-size:10px; font-weight:700; letter-spacing:.18em; color:var(--gold); text-transform:uppercase; background:rgba(201,168,76,.12); padding:4px 10px; border-radius:999px; }
  .head-right{ display:flex; align-items:center; gap:14px; }
  .clock{ font-variant-numeric:tabular-nums; color:var(--text-2); font-size:15px; font-weight:600; letter-spacing:.03em; }
  .pill-btn{ background:var(--surface-2); color:var(--text-2); border:1px solid var(--border); padding:9px 16px; border-radius:11px; font-size:12px; font-weight:600; letter-spacing:.02em; transition:background .15s,color .15s,border-color .15s; }
  .pill-btn:hover{ background:var(--elevate); color:var(--text); border-color:var(--border-2); }
  .dot{ width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:7px; vertical-align:middle; }
  .dot.live{ background:var(--ready); box-shadow:0 0 0 3px rgba(52,211,153,.2); }
  .dot.off{ background:var(--text-3); }
  .conn{ font-size:11px; font-weight:600; letter-spacing:.08em; color:var(--text-3); text-transform:uppercase; }

  /* ── Login ── */
  #login-view{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; gap:8px; }
  #login-view h1{ font-family:var(--display); color:var(--text); letter-spacing:.14em; text-transform:uppercase; font-size:25px; font-weight:700; margin:0; text-align:center; }
  #login-view .tag{ font-size:12px; font-weight:600; letter-spacing:.2em; color:var(--gold); text-transform:uppercase; }
  .login-divider{ width:130px; height:1px; margin:18px 0 22px; background:var(--border-2); }
  .login-card{ background:var(--surface); border:1px solid var(--border); border-radius:20px; box-shadow:0 24px 60px rgba(0,0,0,.5); padding:28px; width:100%; max-width:380px; display:flex; flex-direction:column; gap:13px; }
  .login-card input{ background:var(--bg-2); border:1px solid var(--border-2); color:var(--text); padding:15px 16px; border-radius:12px; font-size:16px; font-family:var(--body); font-weight:500; transition:border-color .15s,box-shadow .15s; }
  .login-card input::placeholder{ color:var(--text-3); }
  .login-card input:focus{ outline:none; border-color:var(--gold-d); box-shadow:0 0 0 3px rgba(201,168,76,.16); }
  .btn-gold{ background:linear-gradient(135deg,#F0D88C,var(--gold-d)); color:#2A1A06; font-weight:800; padding:16px; border-radius:12px; letter-spacing:.04em; font-size:14px; box-shadow:0 8px 22px rgba(201,168,76,.28); transition:transform .08s,box-shadow .15s,filter .15s; }
  .btn-gold:hover{ filter:brightness(1.05); box-shadow:0 10px 28px rgba(201,168,76,.4); }
  .btn-gold:active{ transform:translateY(1px); }
  .btn-gold:disabled{ opacity:.5; cursor:default; box-shadow:none; }
  .err{ color:var(--danger); font-size:14px; min-height:18px; text-align:center; }

  /* ── Board ── */
  #board-view{ padding:0; }
  .toolbar{ display:flex; align-items:center; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
  .count-chip{ color:var(--text-2); font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; display:flex; align-items:center; gap:10px; }
  .count-chip b{ color:var(--text); font-size:24px; font-weight:800; background:var(--surface-2); border:1px solid var(--border); border-radius:11px; padding:3px 14px; letter-spacing:0; }
  .toggle{ color:var(--text-3); font-size:12px; font-weight:600; display:flex; align-items:center; gap:8px; cursor:pointer; text-transform:uppercase; letter-spacing:.02em; }
  .toggle input{ width:16px; height:16px; accent-color:var(--gold-d); }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:16px; align-items:start; }

  /* ── Card ── */
  .card{
    background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--border-2);
    border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{ transform:translateY(-2px); box-shadow:0 16px 42px rgba(0,0,0,.45); }
  .card.s-pending{ border-left-color:var(--new); box-shadow:0 0 0 1px rgba(245,196,81,.32), 0 12px 34px rgba(245,196,81,.12); }
  .card.s-accepted{ border-left-color:var(--accepted); }
  .card.s-preparing{ border-left-color:var(--preparing); }
  .card.s-ready{ border-left-color:var(--ready); }
  .card.s-out_for_delivery{ border-left-color:var(--delivery); }
  .card.s-delivered,.card.s-cancelled{ border-left-color:var(--text-3); opacity:.6; }
  .card.flash{ animation:flashPulse 1.5s ease-in-out infinite; }
  @keyframes flashPulse{ 0%,100%{ box-shadow:0 0 0 1px rgba(245,196,81,.3), 0 12px 32px rgba(245,196,81,.1);} 50%{ box-shadow:0 0 0 1px rgba(245,196,81,.7), 0 14px 42px rgba(245,196,81,.34);} }

  .card-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:13px 16px 0; min-height:14px; }
  .ordno{ display:flex; align-items:center; gap:6px; }
  .ftype{ font-size:10px; letter-spacing:.1em; text-transform:uppercase; padding:5px 11px; border-radius:8px; font-weight:700; }
  .ftype.pickup{ background:rgba(91,155,240,.16); color:#9cc4f7; }
  .ftype.delivery{ background:rgba(251,146,60,.16); color:#fbbf24; }
  .ftype.dine_in{ background:rgba(201,168,76,.16); color:var(--gold); }

  .meta{ display:flex; align-items:center; justify-content:space-between; padding:11px 16px; }
  .status-badge{ font-size:11px; letter-spacing:.05em; text-transform:uppercase; font-weight:800; padding:5px 13px; border-radius:999px; }
  .sb-pending{ background:var(--new); color:#3a2c00; }
  .sb-accepted{ background:var(--accepted); color:#06203f; }
  .sb-preparing{ background:var(--preparing); color:#231147; }
  .sb-ready{ background:var(--ready); color:#053826; }
  .sb-out_for_delivery{ background:var(--delivery); color:#3a1e00; }
  .sb-delivered,.sb-cancelled{ background:var(--surface-2); color:var(--text-2); }
  .elapsed{ font-size:14px; font-weight:700; color:var(--text-2); font-variant-numeric:tabular-nums; }
  .elapsed.warn{ color:var(--new); }
  .elapsed.late{ color:var(--danger); }

  .cust{ padding:0 16px 13px; font-size:15px; color:var(--text-2); border-bottom:1px solid var(--border); }
  .cust .name{ color:var(--text); font-weight:700; font-size:17px; }
  .cust a{ color:var(--gold); text-decoration:none; }
  .cust .addr{ display:block; margin-top:3px; color:var(--text-3); font-size:14px; }

  .items{ padding:14px 16px; display:flex; flex-direction:column; gap:12px; }
  .line{ display:flex; gap:12px; align-items:baseline; }
  .qty{ color:var(--gold); font-weight:800; min-width:30px; font-size:17px; font-variant-numeric:tabular-nums; }
  .line-body{ flex:1; }
  .line-name{ color:var(--text); font-size:18px; font-weight:700; line-height:1.25; }
  .line-variant{ color:var(--text-3); font-size:14px; font-weight:500; margin-top:1px; }
  .line-note{ color:var(--new); font-size:14px; font-weight:600; margin-top:4px; background:rgba(245,196,81,.1); padding:4px 10px; border-radius:8px; display:inline-block; }
  .line-note::before{ content:"✏ "; }

  .totals{ padding:12px 16px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:baseline; }
  .totals .lbl{ color:var(--text-3); text-transform:uppercase; letter-spacing:.08em; font-size:11px; font-weight:600; }
  .totals .amt{ color:var(--gold); font-size:21px; font-weight:800; font-variant-numeric:tabular-nums; }
  .redeemed{ font-size:13px; color:var(--text-3); text-transform:none; letter-spacing:0; }

  .actions{ padding:12px 13px; display:flex; gap:9px; border-top:1px solid var(--border); }
  .act{ flex:1; padding:15px 8px; border-radius:12px; font-size:13px; letter-spacing:.02em; text-transform:uppercase; font-weight:800; color:#fff; transition:filter .15s, transform .06s; }
  .act:active{ transform:translateY(1px); }
  .act.primary{ background:linear-gradient(135deg,#41D98E,#16A765); box-shadow:0 6px 18px rgba(22,167,101,.3); }
  .act.neutral{ background:linear-gradient(135deg,#6AA9F2,#3B7FD6); box-shadow:0 6px 18px rgba(59,127,214,.3); }
  .act.primary:hover,.act.neutral:hover{ filter:brightness(1.08); }
  .act.danger{ background:transparent; color:var(--danger); border:1px solid rgba(244,112,122,.42); flex:0 0 auto; padding:15px 16px; box-shadow:none; }
  .act.danger:hover{ background:rgba(244,112,122,.12); }
  .act:disabled{ opacity:.5; cursor:default; filter:none; }

  .empty{ text-align:center; padding:100px 20px; color:var(--text-3); }
  .empty .big{ font-family:var(--display); font-size:20px; letter-spacing:.1em; color:var(--text-2); text-transform:uppercase; margin-bottom:10px; }
  .empty .big + div{ font-size:15px; }

  .sound-prompt{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--surface-2); color:var(--gold); border:1px solid var(--border-2); padding:13px 22px; border-radius:999px; font-size:13px; font-weight:600; z-index:50; cursor:pointer; box-shadow:0 12px 30px rgba(0,0,0,.5); }
  .sound-prompt:hover{ background:var(--elevate); }
</style>

</head>
<body>

  <div id="watermark"></div>

  <!-- LOGIN -->
  <div id="login-view">
    <div class="logo-medallion lg" style="margin-bottom:18px;"><img src="logo.png" alt="Shaahi Biryani" /></div>
    <h1>Shaahi Biryani</h1>
    <div class="tag">Kitchen Display</div>
    <div class="login-divider"></div>
    <div class="login-card">
      <input id="email" type="email" placeholder="Staff email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" />
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" />
      <button id="login-btn" class="btn-gold">Sign in</button>
      <div id="login-err" class="err"></div>
    </div>
  </div>

  <!-- BOARD -->
  <div id="board-view" class="hidden">
    <header>
      <div class="brand">
        <div class="logo-medallion"><img src="logo.png" alt="Shaahi Biryani" /></div>
        <span class="sub">Kitchen</span>
      </div>
      <div class="head-right">
        <span class="conn"><span id="conn-dot" class="dot off"></span><span id="conn-text">connecting…</span></span>
        <span id="clock" class="clock"></span>
        <button id="signout-btn" class="pill-btn">Sign out</button>
      </div>
    </header>

    <div style="padding:0 18px;">
      <div class="toolbar" style="margin-top:16px;">
        <span class="count-chip"><b id="active-count">0</b> active orders</span>
        <label class="toggle"><input type="checkbox" id="show-done" /> Show completed today</label>
        <button id="refresh-btn" class="pill-btn">Refresh</button>
      </div>
    </div>

    <div id="board-view-inner" style="padding:0 18px 40px;">
      <div id="grid" class="grid"></div>
      <div id="empty" class="empty hidden">
        <div class="big">No active orders</div>
        <div>New orders will appear here automatically.</div>
      </div>
    </div>
  </div>

  <div id="sound-prompt" class="sound-prompt hidden">🔔 Tap to enable new-order sound</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// ── Config (anon key is public by design — safe to embed) ──
const SUPABASE_URL = 'https://wtdthjhqgsbnyjucdqxl.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0ZHRoamhxZ3NibnlqdWNkcXhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NjcxMzcsImV4cCI6MjA5MjQ0MzEzN30.1WYVcbrulkg0l7QB-scj4KcJCnMwFKSLHXucEdEZV3Q';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
});

const POLL_MS = 10000;
const ACTIVE = ['pending','accepted','preparing','ready','out_for_delivery'];

// Status → which transitions a button offers
function nextActions(status, fulfillment) {
  switch (status) {
    case 'pending':    return [{ label: 'Accept', to: 'accepted', cls: 'primary' }];
    case 'accepted':   return [{ label: 'Start preparing', to: 'preparing', cls: 'primary' }];
    case 'preparing':  return [{ label: 'Mark ready', to: 'ready', cls: 'primary' }];
    case 'ready':
      return fulfillment === 'delivery'
        ? [{ label: 'Out for delivery', to: 'out_for_delivery', cls: 'neutral' }]
        : [{ label: 'Complete', to: 'delivered', cls: 'primary' }];
    case 'out_for_delivery': return [{ label: 'Delivered', to: 'delivered', cls: 'primary' }];
    default: return [];
  }
}

const $ = (id) => document.getElementById(id);
const fmtMoney = (n) => '$' + Number(n || 0).toFixed(2);
const ordNo = (id) => id.slice(-6).toUpperCase();

// ── State ──
let pollTimer = null;
let knownPendingIds = new Set();
let firstLoad = true;
let soundReady = false;
let audioCtx = null;

// ── Auth flow ──
async function init() {
  const { data } = await supabase.auth.getSession();
  if (data.session) await enterBoard();
  else showLogin();
}

function showLogin() {
  $('login-view').classList.remove('hidden');
  $('board-view').classList.add('hidden');
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

$('login-btn').addEventListener('click', doLogin);
$('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const btn = $('login-btn');
  const email = $('email').value.trim();
  const password = $('password').value;
  $('login-err').textContent = '';
  if (!email || !password) { $('login-err').textContent = 'Enter email and password.'; return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'Sign in';
  if (error) { $('login-err').textContent = error.message; return; }
  await enterBoard();
}

$('signout-btn').addEventListener('click', async () => {
  await supabase.auth.signOut();
  knownPendingIds = new Set(); firstLoad = true;
  showLogin();
});

async function enterBoard() {
  // Gate: must be staff.
  const { data: isStaff, error } = await supabase.rpc('current_user_is_staff');
  if (error || !isStaff) {
    await supabase.auth.signOut();
    $('login-view').classList.remove('hidden');
    $('board-view').classList.add('hidden');
    $('login-err').textContent = error
      ? 'Could not verify access. Try again.'
      : 'This account is not authorized for the kitchen view.';
    return;
  }
  $('login-view').classList.add('hidden');
  $('board-view').classList.remove('hidden');
  if (!soundReady) $('sound-prompt').classList.remove('hidden');
  firstLoad = true;
  await loadOrders();
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(loadOrders, POLL_MS);
}

// ── Data ──
async function loadOrders() {
  const showDone = $('show-done').checked;
  const statuses = showDone ? [...ACTIVE, 'delivered', 'cancelled'] : ACTIVE;

  let query = supabase
    .from('orders')
    .select('id, status, fulfillment, subtotal, tax, delivery_fee, tip, total, points_redeemed, delivery_address, created_at, user_id, guest_name, guest_phone, source, payment_status, order_items(item_name, variant_name, quantity, unit_price, special_instructions)')
    .in('status', statuses)
    // Show all app orders, but only PAID website (guest) orders — so abandoned
    // guest checkouts never show up. App orders have a user_id; guest orders don't.
    .or('user_id.not.is.null,payment_status.eq.paid')
    .order('created_at', { ascending: true });

  // When showing completed, keep the list manageable.
  if (showDone) query = query.order('created_at', { ascending: false }).limit(60);

  const { data: orders, error } = await query;
  if (error) { setConn(false, 'connection lost'); return; }
  setConn(true, 'live');

  // Fetch customer profiles in one go (no FK dependency assumed).
  const userIds = [...new Set(orders.map((o) => o.user_id).filter(Boolean))];
  let profiles = {};
  if (userIds.length) {
    const { data: profRows } = await supabase
      .from('profiles').select('id, full_name, phone, email').in('id', userIds);
    (profRows || []).forEach((p) => { profiles[p.id] = p; });
  }

  // New pending-order chime.
  const pendingNow = orders.filter((o) => o.status === 'pending').map((o) => o.id);
  if (!firstLoad) {
    const fresh = pendingNow.filter((id) => !knownPendingIds.has(id));
    if (fresh.length) chime();
  }
  knownPendingIds = new Set(pendingNow);
  firstLoad = false;

  render(orders, profiles);
}

function render(orders, profiles) {
  const grid = $('grid');
  const showDone = $('show-done').checked;
  const visible = orders; // already filtered by query
  $('active-count').textContent = orders.filter((o) => ACTIVE.includes(o.status)).length;

  if (!visible.length) {
    grid.innerHTML = '';
    $('empty').classList.remove('hidden');
    return;
  }
  $('empty').classList.add('hidden');

  grid.innerHTML = visible.map((o) => card(o, profiles[o.user_id])).join('');

  // Wire action buttons.
  grid.querySelectorAll('button[data-order]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-order');
      const to = btn.getAttribute('data-to');
      if (to === 'cancelled' && !confirm('Cancel this order? This also reverses any loyalty points.')) return;
      updateStatus(id, to, btn);
    });
  });
}

function card(o, prof) {
  const items = o.order_items || [];
  const isDone = o.status === 'delivered' || o.status === 'cancelled';
  const acts = nextActions(o.status, o.fulfillment);
  const addr = o.delivery_address;
  const flash = o.status === 'pending' ? 'flash' : '';

  const itemsHtml = items.map((it) => `
    <div class="line">
      <div class="qty">${it.quantity}×</div>
      <div class="line-body">
        <div class="line-name">${esc(it.item_name)}</div>
        ${it.variant_name ? `<div class="line-variant">${esc(it.variant_name)}</div>` : ''}
        ${it.special_instructions ? `<div class="line-note">${esc(it.special_instructions)}</div>` : ''}
      </div>
    </div>`).join('');

  // Website orders are guests (no profile) — fall back to the name/phone
  // captured at web checkout, which ride on the order row itself.
  const custName = prof?.full_name || o.guest_name || 'Guest';
  const custPhone = prof?.phone || o.guest_phone || '';
  const custHtml = `
    <div class="cust">
      <span class="name">${esc(custName)}</span>
      ${custPhone ? ` · <a href="tel:${esc(custPhone)}">${esc(custPhone)}</a>` : ''}
      ${o.fulfillment === 'delivery' && addr
        ? `<span class="addr">${esc(addr.street || '')}${addr.apt ? ', ' + esc(addr.apt) : ''}, ${esc(addr.city || '')} ${esc(addr.zip || '')}</span>`
        : ''}
    </div>`;

  const actionsHtml = isDone ? '' : `
    <div class="actions">
      ${acts.map((a) => `<button class="act ${a.cls}" data-order="${o.id}" data-to="${a.to}">${a.label}</button>`).join('')}
      <button class="act danger" data-order="${o.id}" data-to="cancelled">Cancel</button>
    </div>`;

  const statusLabel = o.status.replace(/_/g, ' ');

  return `
    <div class="card s-${o.status} ${flash}" id="card-${o.id}">
      <div class="card-head">
        <div class="ordno">${o.source === 'web' ? '<span style="background:var(--gold);color:var(--maroon-d);font-size:9px;padding:2px 7px;border-radius:5px;letter-spacing:.14em;vertical-align:middle;">WEB</span>' : ''}</div>
        <div class="ftype ${o.fulfillment}">${esc((o.fulfillment || '').replace('_',' '))}</div>
      </div>
      <div class="meta">
        <span class="status-badge sb-${o.status}">${esc(statusLabel)}</span>
        <span class="elapsed" data-created="${o.created_at}"></span>
      </div>
      ${custHtml}
      <div class="items">${itemsHtml || '<div class="line-variant">No items</div>'}</div>
      ${actionsHtml}
    </div>`;
}

async function updateStatus(id, to, btn) {
  // Disable the whole card's buttons during the call.
  const cardEl = $('card-' + id);
  if (cardEl) cardEl.querySelectorAll('button').forEach((b) => (b.disabled = true));
  const { error } = await supabase.rpc('set_order_status', { p_order_id: id, p_status: to });
  if (error) {
    alert('Could not update order: ' + error.message);
    if (cardEl) cardEl.querySelectorAll('button').forEach((b) => (b.disabled = false));
    return;
  }
  notifyCustomer(id, to);
  await loadOrders();
}

// Push the status update to the customer's phone (best-effort —
// never blocks or breaks the kitchen flow).
async function notifyCustomer(orderId, status) {
  try {
    const { data } = await supabase.auth.getSession();
    const token = data?.session?.access_token;
    if (!token) return;
    fetch(SUPABASE_URL + '/functions/v1/notify-order-status', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: 'Bearer ' + token,
        apikey: SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({ order_id: orderId, status }),
    }).catch(() => {});
  } catch {
    /* best-effort */
  }
}

// ── Elapsed-time ticker ──
function tickElapsed() {
  document.querySelectorAll('.elapsed[data-created]').forEach((el) => {
    const created = new Date(el.getAttribute('data-created')).getTime();
    const mins = Math.floor((Date.now() - created) / 60000);
    el.textContent = mins < 1 ? 'just now' : mins + ' min';
    el.classList.toggle('warn', mins >= 15 && mins < 30);
    el.classList.toggle('late', mins >= 30);
  });
}

// ── Clock ──
function tickClock() {
  const d = new Date();
  $('clock').textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function setConn(ok, text) {
  $('conn-dot').className = 'dot ' + (ok ? 'live' : 'off');
  $('conn-text').textContent = text;
}

// ── Sound ──
$('sound-prompt').addEventListener('click', () => {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  soundReady = true;
  $('sound-prompt').classList.add('hidden');
  chime();
});

function chime() {
  if (!soundReady || !audioCtx) return;
  const now = audioCtx.currentTime;
  [880, 1175, 1568].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    osc.connect(gain); gain.connect(audioCtx.destination);
    const t = now + i * 0.16;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.25, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    osc.start(t); osc.stop(t + 0.42);
  });
}

// ── Listeners ──
$('show-done').addEventListener('change', loadOrders);
$('refresh-btn').addEventListener('click', loadOrders);
supabase.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_OUT') showLogin();
});

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

setInterval(tickElapsed, 1000);
setInterval(tickClock, 1000);
tickClock();
init();
</script>
